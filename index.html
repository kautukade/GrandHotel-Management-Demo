<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grandora Hotel OS — ITCYBER Demo</title>
<style>
:root{--bg:#07111f;--p:#0d1a2c;--p2:#14243a;--line:#223550;--txt:#edf4ff;--mut:#8fa1b8;--gold:#e2bd67;--green:#38d996;--orange:#ffb85c;--red:#ff7482;--blue:#6babff}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:var(--bg);color:var(--txt)}button,input,select{font:inherit}.ribbon{height:25px;background:var(--gold);color:#161616;text-align:center;font-size:10px;letter-spacing:.14em;font-weight:900;line-height:25px}.shell{display:grid;grid-template-columns:245px 1fr;min-height:calc(100vh - 25px)}aside{border-right:1px solid var(--line);padding:22px 14px;background:linear-gradient(180deg,#091625,#07111f);position:sticky;top:0;height:calc(100vh - 25px);overflow:auto}.brand{display:flex;gap:11px;align-items:center;padding:0 8px 22px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,#f4db96,#b9852c);display:grid;place-items:center;color:#14110a;font-family:Georgia,serif;font-size:25px;font-weight:900}.brand b{font-family:Georgia,serif;font-size:19px}.brand small{display:block;color:var(--mut);margin-top:3px}.nav button{width:100%;border:0;color:#9db0c7;background:transparent;padding:11px 12px;border-radius:11px;text-align:left;margin:2px 0;font-weight:700}.nav button:hover,.nav button.active{background:#14233a;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--gold)}.aside-card{margin-top:18px;padding:15px;border:1px solid #3d3523;border-radius:15px;background:#15170f}.aside-card small{color:var(--gold);font-weight:800}.aside-card b{display:block;margin:6px 0 12px}.main{min-width:0}.top{height:83px;display:flex;justify-content:space-between;align-items:center;padding:0 25px;border-bottom:1px solid var(--line);background:#07111fe6;position:sticky;top:0;z-index:10;backdrop-filter:blur(14px)}h1,h2,h3,p{margin-top:0}.top h1{font-size:22px;margin:3px 0}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--gold);font-weight:900}.actions{display:flex;align-items:center;gap:8px}.btn{border:1px solid var(--line);background:#11223a;color:#fff;border-radius:10px;padding:9px 13px;font-weight:800}.btn.primary{background:var(--gold);border-color:var(--gold);color:#17120a}.btn.ghost{background:transparent}.btn.green{background:#0f4c38;border-color:#1e6f52}.btn.red{background:#4d1d26;border-color:#6c2935}.content{padding:25px}.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:linear-gradient(180deg,#0e1b2d,#0b1728);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 16px 45px #0003}.kpi span{color:var(--mut);font-size:12px}.kpi strong{display:block;font-size:28px;margin:8px 0 4px}.good{color:var(--green)}.warn{color:var(--orange)}.bad{color:var(--red)}.two{grid-template-columns:1.3fr .7fr;margin-top:14px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.section-head h2{font-size:17px;margin:0}.table{width:100%;border-collapse:collapse;font-size:12px}.table th{color:#788da8;text-align:left;border-bottom:1px solid var(--line);padding:9px}.table td{padding:11px 9px;border-bottom:1px solid #182a43}.pill{display:inline-block;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900;background:#172a43;color:#cfe0f8}.pill.green{background:#123c2e;color:#8ef0c4}.pill.orange{background:#4a3518;color:#ffd39a}.pill.red{background:#48202a;color:#ffb0b9}.room-grid,.table-grid,.mini-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.room,.table-card{border:1px solid var(--line);background:#0a1728;border-radius:15px;padding:15px}.room b,.table-card b{font-size:18px}.room small,.table-card small{display:block;color:var(--mut);margin:5px 0 10px}.room.occupied{border-color:#31598d}.room.dirty{border-color:#7a5521}.room.ready{border-color:#25694d}.table-card img{width:120px;height:120px;background:#fff;border-radius:10px;padding:6px;display:block;margin:10px auto}.table-card .row{display:flex;gap:6px}.table-card .row .btn{flex:1;padding:8px;font-size:11px}.order-board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.lane{background:#091625;border:1px solid var(--line);border-radius:16px;padding:12px;min-height:320px}.lane h3{font-size:13px;color:#a9bdd6}.ticket{background:#12223a;border:1px solid #253954;border-radius:13px;padding:12px;margin:9px 0}.ticket b{font-size:12px}.ticket p{font-size:11px;color:var(--mut);margin:6px 0}.ticket .btn{width:100%;margin-top:8px;padding:7px;font-size:10px}.bar{height:8px;background:#152844;border-radius:99px;overflow:hidden}.bar i{height:100%;display:block;background:var(--gold)}.chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:20px}.chart i{flex:1;background:linear-gradient(180deg,#e2bd67,#735a26);border-radius:6px 6px 0 0;min-height:12px;position:relative}.chart i span{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-style:normal;font-size:9px;color:var(--mut)}.empty{color:var(--mut);text-align:center;padding:35px}.mobile{display:none}.modal{position:fixed;inset:0;background:#020813cc;display:none;place-items:center;z-index:50;padding:18px}.modal.open{display:grid}.modalbox{width:min(620px,96vw);max-height:90vh;overflow:auto;background:#0d1b2e;border:1px solid var(--line);border-radius:18px;padding:20px}.modalhead{display:flex;justify-content:space-between}.close{border:0;background:transparent;color:#fff;font-size:25px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:5px}.field label{font-size:10px;color:var(--mut)}.field input,.field select{background:#081525;color:#fff;border:1px solid var(--line);padding:10px;border-radius:10px}.toast{position:fixed;right:20px;bottom:20px;background:#173426;color:#bdf4d6;border:1px solid #2a7550;padding:11px 14px;border-radius:10px;z-index:80;font-size:12px;font-weight:800}.note{font-size:11px;color:var(--mut);line-height:1.6}.link{color:var(--gold);text-decoration:none}.statline{display:flex;justify-content:space-between;margin:10px 0;font-size:12px}.statline span{color:var(--mut)}
@media(max-width:950px){.shell{grid-template-columns:1fr}aside{position:fixed;z-index:30;left:-260px;width:245px;top:25px;transition:.25s}.shell.menu aside{left:0}.mobile{display:inline-block}.kpis,.room-grid,.table-grid,.mini-grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.order-board{grid-template-columns:1fr 1fr}.top{padding:0 14px}.content{padding:14px}.actions .hide-sm{display:none}}
@media(max-width:620px){.kpis,.room-grid,.table-grid,.mini-grid,.order-board,.formgrid{grid-template-columns:1fr}.top h1{font-size:17px}.content{padding:10px}.card{padding:14px}.table{font-size:10px}.table td,.table th{padding:8px 5px}}
</style>
</head>
<body>
<div class="ribbon">ITCYBER TECHNOLOGIES · LARGE HOTEL MANAGEMENT WORKING FRONTEND DEMO</div>
<div class="shell" id="shell">
<aside>
  <div class="brand"><div class="logo">G</div><div><b>Grandora</b><small>Hotel OS · Demo</small></div></div>
  <div class="nav" id="nav"></div>
  <div class="aside-card"><small>LIVE SALES DEMO</small><b>Table T12 customer order</b><button class="btn primary" style="width:100%" onclick="openCustomer('T12')">Open customer menu ↗</button></div>
</aside>
<div class="main">
<header class="top"><div style="display:flex;gap:10px;align-items:center"><button class="btn mobile" onclick="document.getElementById('shell').classList.toggle('menu')">☰</button><div><div class="eyebrow">Grandora Palace · Enterprise Property</div><h1 id="title">Hotel Overview</h1></div></div><div class="actions"><span class="pill green hide-sm">● System Live</span><button class="btn hide-sm" onclick="seed(true)">Reset demo</button><button class="btn primary" onclick="openCustomer('T12')">Customer Demo</button></div></header>
<main class="content" id="view"></main>
</div></div>
<div class="modal" id="modal"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Details</h2><button class="close" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], STORE={orders:'grandora_orders_v2',rooms:'grandora_rooms_v2',res:'grandora_res_v2'};
const nav=[['dashboard','⌂','Overview'],['reservations','◫','Reservations'],['rooms','▦','Rooms'],['tables','◉','Table QR'],['orders','☷','Orders'],['kitchen','♨','Kitchen'],['billing','₹','Billing & POS'],['housekeeping','✦','Housekeeping'],['inventory','▤','Inventory'],['staff','♙','Staff'],['reports','↗','Reports'],['settings','⚙','Settings']];
const sampleOrders=[{id:'ORD-1204',table:'T04',customer:'Mehta Family',phone:'98•••4412',items:[['Paneer Tikka',2],['Butter Naan',4]],total:1120,status:'Preparing',payment:'Online · Paid',time:'12:42 PM'},{id:'ORD-1205',table:'T09',customer:'Guest',phone:'90•••2381',items:[['Chicken Biryani',2],['Fresh Lime Soda',2]],total:1071,status:'New',payment:'Pay at counter',time:'12:48 PM'},{id:'ORD-1206',table:'T15',customer:'R. Patil',phone:'97•••8034',items:[['Veg Thali',3]],total:1544,status:'Ready',payment:'Online · Paid',time:'12:51 PM'}];
const roomSeed=Array.from({length:24},(_,i)=>({no:101+i,floor:i<8?1:i<16?2:3,type:i%5===0?'Suite':i%3===0?'Deluxe':'Executive',status:i%7===0?'Dirty':i%3===0?'Ready':'Occupied',guest:i%3===0?'—':['A. Sharma','N. Gupta','K. Rao','S. Mehta'][i%4]}));
const resSeed=[{id:'RSV-4102',guest:'Kunal Shah',room:'204 · Deluxe',checkin:'Today 2:00 PM',nights:2,status:'Arriving'},{id:'RSV-4103',guest:'Priya Nair',room:'312 · Suite',checkin:'Today 4:30 PM',nights:3,status:'Confirmed'},{id:'RSV-4104',guest:'Amit Verma',room:'108 · Executive',checkin:'Tomorrow 11:30 AM',nights:1,status:'Confirmed'},{id:'RSV-4105',guest:'Sneha Joshi',room:'—',checkin:'Walk-in',nights:1,status:'Pending'}];
function seed(force=false){if(force||!localStorage.getItem(STORE.orders))localStorage.setItem(STORE.orders,JSON.stringify(sampleOrders));if(force||!localStorage.getItem(STORE.rooms))localStorage.setItem(STORE.rooms,JSON.stringify(roomSeed));if(force||!localStorage.getItem(STORE.res))localStorage.setItem(STORE.res,JSON.stringify(resSeed));if(force){toast('Demo data reset');render(active)}}
function get(k){return JSON.parse(localStorage.getItem(k)||'[]')} function set(k,v){localStorage.setItem(k,JSON.stringify(v))} function money(n){return '₹'+Number(n).toLocaleString('en-IN')} function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2300)}
function openModal(t,b){$('#modalTitle').textContent=t;$('#modalBody').innerHTML=b;$('#modal').classList.add('open')} function closeModal(){$('#modal').classList.remove('open')} function openCustomer(t){location.href='order.html?table='+t}
let active='dashboard';
$('#nav').innerHTML=nav.map(n=>`<button data-v="${n[0]}">${n[1]} &nbsp; ${n[2]}</button>`).join('');$$('#nav button').forEach(b=>b.onclick=()=>render(b.dataset.v));
function render(v){active=v;$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));$('#shell').classList.remove('menu');const name=nav.find(n=>n[0]===v)?.[2]||'Hotel OS';$('#title').textContent=name;views[v]();}
function quickTable(rows,heads){return `<div style="overflow:auto"><table class="table"><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`}
const views={
dashboard(){const o=get(STORE.orders),r=get(STORE.rooms),res=get(STORE.res),occ=r.filter(x=>x.status==='Occupied').length,rev=o.reduce((s,x)=>s+x.total,0);$('#view').innerHTML=`<div class="grid kpis"><div class="card kpi"><span>Occupancy</span><strong>${Math.round(occ/r.length*100)}%</strong><small class="good">${occ}/${r.length} rooms occupied</small></div><div class="card kpi"><span>Today's room revenue</span><strong>₹2.84L</strong><small class="good">+12.4% vs yesterday</small></div><div class="card kpi"><span>Restaurant live sales</span><strong>${money(rev)}</strong><small class="warn">${o.length} active/demo orders</small></div><div class="card kpi"><span>Arrivals today</span><strong>${res.length}</strong><small class="good">2 rooms ready now</small></div></div><div class="grid two"><div class="card"><div class="section-head"><h2>Live restaurant orders</h2><button class="btn" onclick="render('orders')">Open orders →</button></div>${quickTable(o.slice(0,5).map(x=>`<tr><td><b>${x.id}</b><br><small>${x.time}</small></td><td>${x.table}</td><td>${x.customer}</td><td>${x.items.map(i=>i[1]+'× '+i[0]).join(', ')}</td><td>${money(x.total)}</td><td><span class="pill ${x.status==='Ready'?'green':x.status==='New'?'orange':''}">${x.status}</span></td></tr>`),['Order','Table','Guest','Items','Amount','Status'])}</div><div class="card"><div class="section-head"><h2>Property pulse</h2><span class="pill green">Healthy</span></div><div class="statline"><span>Check-ins completed</span><b>11 / 16</b></div><div class="bar"><i style="width:69%"></i></div><div class="statline"><span>Housekeeping rooms ready</span><b>18 / 21</b></div><div class="bar"><i style="width:86%"></i></div><div class="statline"><span>Kitchen SLA under 20 min</span><b>92%</b></div><div class="bar"><i style="width:92%"></i></div><div class="statline"><span>Online payment success</span><b>98.6%</b></div><div class="bar"><i style="width:98%"></i></div><p class="note" style="margin-top:18px">Frontend sales-demo data. Production version connects every module to realtime backend, staff permissions, printers and payment webhooks.</p></div></div>`},
reservations(){const x=get(STORE.res);$('#view').innerHTML=`<div class="card"><div class="section-head"><h2>Reservations & front desk</h2><button class="btn primary" onclick="newReservation()">+ New reservation</button></div>${quickTable(x.map(a=>`<tr><td><b>${a.id}</b></td><td>${a.guest}</td><td>${a.room}</td><td>${a.checkin}</td><td>${a.nights}</td><td><span class="pill ${a.status==='Arriving'?'orange':'green'}">${a.status}</span></td><td><button class="btn" onclick="toast('Check-in flow opened for ${a.guest}')">Check-in</button></td></tr>`),['Booking','Guest','Room','Check-in','Nights','Status','Action'])}</div>`},
rooms(){const r=get(STORE.rooms);$('#view').innerHTML=`<div class="section-head"><div><h2>Room status board</h2><p class="note">Front desk + housekeeping demo view</p></div><span class="pill green">${r.filter(x=>x.status==='Ready').length} ready</span></div><div class="room-grid">${r.map(x=>`<div class="room ${x.status.toLowerCase()}"><div class="section-head"><b>${x.no}</b><span class="pill ${x.status==='Ready'?'green':x.status==='Dirty'?'orange':''}">${x.status}</span></div><small>${x.type} · Floor ${x.floor}</small><div>${x.guest}</div><button class="btn" style="width:100%;margin-top:12px" onclick="cycleRoom(${x.no})">Update status</button></div>`).join('')}</div>`},
tables(){const tables=Array.from({length:16},(_,i)=>'T'+String(i+1).padStart(2,'0'));$('#view').innerHTML=`<div class="section-head"><div><h2>Restaurant table QR system</h2><p class="note">Each QR opens a table-specific customer ordering page. Customer enters WhatsApp number before ordering.</p></div><span class="pill green">16 tables mapped</span></div><div class="table-grid">${tables.map((t,i)=>{const u=new URL('order.html?table='+t,location.href).href;const qr='https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(u);return `<div class="table-card"><div class="section-head"><b>${t}</b><span class="pill ${i%4===1?'orange':'green'}">${i%4===1?'Dining':'Available'}</span></div><small>QR-linked ordering station</small><img src="${qr}" alt="QR ${t}"><div class="row"><button class="btn primary" onclick="openCustomer('${t}')">Open</button><button class="btn" onclick="navigator.clipboard.writeText('${u}').then(()=>toast('Link copied'))">Copy link</button></div></div>`}).join('')}</div>`},
orders(){const o=get(STORE.orders);$('#view').innerHTML=`<div class="card"><div class="section-head"><h2>Restaurant order management</h2><button class="btn primary" onclick="openCustomer('T12')">+ Demo table order</button></div>${o.length?quickTable(o.map(x=>`<tr><td><b>${x.id}</b><br><small>${x.time}</small></td><td>${x.table}</td><td>${x.customer}<br><small>${x.phone}</small></td><td>${x.items.map(i=>i[1]+'× '+i[0]).join('<br>')}</td><td>${money(x.total)}</td><td>${x.payment}</td><td><span class="pill">${x.status}</span></td><td><button class="btn" onclick="advance('${x.id}')">Advance</button></td></tr>`),['Order','Table','Customer','Items','Total','Payment','Status','Action']):'<div class="empty">No orders yet. Open customer demo and place one.</div>'}</div>`},
kitchen(){const o=get(STORE.orders), sts=['New','Preparing','Ready','Served'];$('#view').innerHTML=`<div class="section-head"><div><h2>Kitchen Display System</h2><p class="note">Order tickets move from New → Preparing → Ready → Served.</p></div><span class="pill green">KDS live</span></div><div class="order-board">${sts.map(s=>`<div class="lane"><h3>${s.toUpperCase()} · ${o.filter(x=>x.status===s).length}</h3>${o.filter(x=>x.status===s).map(x=>`<div class="ticket"><b>${x.id} · ${x.table}</b><p>${x.items.map(i=>i[1]+'× '+i[0]).join('<br>')}</p><small>${x.time} · ${x.payment}</small>${s!=='Served'?`<button class="btn primary" onclick="advance('${x.id}')">Move forward →</button>`:''}</div>`).join('')||'<div class="empty">No tickets</div>'}</div>`).join('')}</div>`},
billing(){const o=get(STORE.orders);$('#view').innerHTML=`<div class="grid two"><div class="card"><div class="section-head"><h2>Billing & POS</h2><span class="pill green">GST demo</span></div>${quickTable(o.map(x=>`<tr><td>${x.id}</td><td>${x.table}</td><td>${money(x.total)}</td><td>${x.payment}</td><td><button class="btn" onclick="bill('${x.id}')">Print bill</button></td></tr>`),['Bill ref','Table','Amount','Payment','Action'])}</div><div class="card"><h2>Today's payment split</h2><div class="statline"><span>UPI / Online</span><b>₹38,420</b></div><div class="statline"><span>Cards</span><b>₹21,870</b></div><div class="statline"><span>Cash / Counter</span><b>₹12,950</b></div><div class="statline"><span>Room posting</span><b>₹8,320</b></div><hr style="border-color:#20324d"><div class="statline"><span>Total restaurant</span><b>₹81,560</b></div><p class="note">Production: Razorpay/Cashfree webhooks, UPI intent, refunds, split settlement and GST invoice export.</p></div></div>`},
housekeeping(){const r=get(STORE.rooms);$('#view').innerHTML=`<div class="grid two"><div class="card"><div class="section-head"><h2>Housekeeping queue</h2><span class="pill orange">${r.filter(x=>x.status==='Dirty').length} attention</span></div>${quickTable(r.filter(x=>x.status==='Dirty'||x.status==='Ready').slice(0,12).map(x=>`<tr><td><b>${x.no}</b></td><td>${x.type}</td><td>${x.status}</td><td>${x.status==='Dirty'?'Deep clean':'QA verified'}</td><td><button class="btn" onclick="cycleRoom(${x.no})">Update</button></td></tr>`),['Room','Type','Status','Task','Action'])}</div><div class="card"><h2>Team workload</h2>${['Rani · Floor 1|75','Meena · Floor 2|58','Sanjay · Floor 3|82','Laundry Team|63'].map(v=>{let[a,b]=v.split('|');return `<div class="statline"><span>${a}</span><b>${b}%</b></div><div class="bar"><i style="width:${b}%"></i></div>`}).join('')}</div></div>`},
inventory(){$('#view').innerHTML=`<div class="grid two"><div class="card"><div class="section-head"><h2>F&B inventory</h2><button class="btn primary" onclick="toast('Purchase order draft created')">+ Purchase order</button></div>${quickTable([['Basmati Rice','42 kg','18 kg','Healthy'],['Paneer','8 kg','10 kg','Low'],['Chicken','19 kg','12 kg','Healthy'],['Mineral Water','64 bottles','120','Low'],['Cooking Oil','27 L','15 L','Healthy'],['Coffee Beans','3.2 kg','4 kg','Low']].map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td><td><span class="pill ${x[3]==='Low'?'orange':'green'}">${x[3]}</span></td></tr>`),['Item','In stock','Par level','Status'])}</div><div class="card"><h2>Inventory automation</h2><p class="note">Demo shows par-level monitoring, low-stock alerts, purchase planning and restaurant consumption linkage.</p><div class="statline"><span>Inventory value</span><b>₹4.72L</b></div><div class="statline"><span>Low stock SKUs</span><b class="warn">7</b></div><div class="statline"><span>Waste this week</span><b>1.8%</b></div><div class="statline"><span>Pending POs</span><b>3</b></div></div></div>`},
staff(){$('#view').innerHTML=`<div class="card"><div class="section-head"><h2>Staff & shifts</h2><button class="btn primary" onclick="toast('Staff form opened')">+ Add staff</button></div>${quickTable([['Aarav Kulkarni','Front Office Manager','09:00–18:00','On duty'],['Neha Singh','Restaurant Captain','12:00–22:00','On duty'],['Imran Shaikh','Executive Chef','11:00–23:00','On duty'],['Rani More','Housekeeping','08:00–17:00','On duty'],['Rahul Jain','Night Auditor','22:00–07:00','Next shift'],['Pooja Deshmukh','Accounts','10:00–19:00','Break']].map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td><td><span class="pill ${x[3]==='On duty'?'green':''}">${x[3]}</span></td></tr>`),['Employee','Role','Shift','Status'])}</div>`},
reports(){$('#view').innerHTML=`<div class="grid kpis"><div class="card kpi"><span>ADR</span><strong>₹6,840</strong><small class="good">+8.2%</small></div><div class="card kpi"><span>RevPAR</span><strong>₹5,130</strong><small class="good">+11.1%</small></div><div class="card kpi"><span>F&B avg bill</span><strong>₹1,386</strong><small class="good">+6.4%</small></div><div class="card kpi"><span>Guest rating</span><strong>4.7/5</strong><small class="good">426 reviews</small></div></div><div class="grid two"><div class="card"><h2>7-day revenue trend</h2><div class="chart">${[48,62,56,78,67,85,92].map((h,i)=>`<i style="height:${h}%"><span>${['M','T','W','T','F','S','S'][i]}</span></i>`).join('')}</div></div><div class="card"><h2>Performance snapshot</h2><div class="statline"><span>Room revenue</span><b>₹19.8L</b></div><div class="statline"><span>F&B revenue</span><b>₹6.4L</b></div><div class="statline"><span>Direct bookings</span><b>41%</b></div><div class="statline"><span>OTA bookings</span><b>37%</b></div><div class="statline"><span>Corporate</span><b>22%</b></div></div></div>`},
settings(){$('#view').innerHTML=`<div class="grid two"><div class="card"><h2>Production integration roadmap</h2><p class="note">This repository is intentionally frontend-only for hotel sales demos. Production rollout would connect:</p>${['Supabase/PostgreSQL realtime database','Role-based staff login & audit logs','WhatsApp Cloud API order/bill messages','Razorpay/Cashfree payment links + webhooks','KOT / thermal printer integration','PMS / OTA / channel manager integration','Inventory purchase & vendor module','Cloud backups, analytics and multi-property support'].map(x=>`<div class="statline"><span>✓ ${x}</span><b class="good">Ready to build</b></div>`).join('')}</div><div class="card"><h2>Demo controls</h2><p class="note">Use these during a hotel presentation.</p><button class="btn primary" style="width:100%;margin-bottom:8px" onclick="openCustomer('T12')">Open Table T12 Customer Flow</button><button class="btn" style="width:100%;margin-bottom:8px" onclick="render('tables')">Show all table QR codes</button><button class="btn red" style="width:100%" onclick="seed(true)">Reset seeded demo data</button></div></div>`}
};
function advance(id){const a=get(STORE.orders),x=a.find(o=>o.id===id);if(!x)return;const s=['New','Preparing','Ready','Served'];x.status=s[Math.min(s.length-1,s.indexOf(x.status)+1)];set(STORE.orders,a);toast(id+' → '+x.status);render(active)}
function cycleRoom(no){const a=get(STORE.rooms),x=a.find(r=>r.no===no),s=['Occupied','Dirty','Ready'];x.status=s[(s.indexOf(x.status)+1)%s.length];if(x.status==='Ready')x.guest='—';set(STORE.rooms,a);toast('Room '+no+' → '+x.status);render(active)}
function bill(id){const o=get(STORE.orders).find(x=>x.id===id);openModal('Demo Bill · '+id,`<div class="card"><div class="section-head"><b>Grandora Palace</b><span>${o.table}</span></div>${o.items.map(i=>`<div class="statline"><span>${i[1]}× ${i[0]}</span><b></b></div>`).join('')}<hr style="border-color:#20324d"><div class="statline"><span>Total</span><b>${money(o.total)}</b></div><div class="statline"><span>Payment</span><b>${o.payment}</b></div><button class="btn primary" style="width:100%" onclick="toast('Print simulation sent')">Print / Save PDF</button></div>`)}
function newReservation(){openModal('New Reservation',`<div class="formgrid"><div class="field"><label>Guest name</label><input id="ng" placeholder="Guest name"></div><div class="field"><label>Room</label><input id="nr" placeholder="205 · Deluxe"></div><div class="field"><label>Check-in</label><input id="nc" type="datetime-local"></div><div class="field"><label>Nights</label><input id="nn" type="number" value="1" min="1"></div></div><button class="btn primary" style="width:100%;margin-top:14px" onclick="saveRes()">Create reservation</button>`)}
function saveRes(){const g=$('#ng').value.trim();if(!g)return toast('Enter guest name');const a=get(STORE.res);a.unshift({id:'RSV-'+Math.floor(4000+Math.random()*5000),guest:g,room:$('#nr').value||'Unassigned',checkin:$('#nc').value?new Date($('#nc').value).toLocaleString():'Today',nights:Number($('#nn').value||1),status:'Confirmed'});set(STORE.res,a);closeModal();toast('Reservation created');render('reservations')}
seed();render('dashboard');window.addEventListener('storage',e=>{if(e.key===STORE.orders&&['dashboard','orders','kitchen','billing'].includes(active))render(active)});
</script>
</body></html>
